# À chaque push sur main : tests, build du lab et du jeu, publication sur GitHub Pages.
#   https://<utilisateur>.github.io/<depot>/      → le lab
#   https://<utilisateur>.github.io/<depot>/jeu/  → le jeu Shallot
name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Tests des niveaux
        run: bun run test
      - name: Build du lab
        run: bun run build:lab
      - name: Build du jeu
        # le jeu est encore expérimental : s'il ne compile pas, le lab est quand même publié
        continue-on-error: true
        run: bun run build:game
      - name: Assemblage du site
        run: |
          mkdir -p _site
          cp -r apps/lab/dist/. _site/
          if [ -d apps/game/dist ]; then mkdir -p _site/jeu && cp -r apps/game/dist/. _site/jeu/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
